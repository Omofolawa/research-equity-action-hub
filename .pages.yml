media: media

content:
  - name: findings
    label: Findings
    type: collection
    path: src/content/findings
    fields:
      - name: title
        label: Title
        type: string
      - name: order
        label: Order Number
        type: number
      - name: summary
        label: Summary
        type: text
      - name: whyItMatters
        label: Why It Matters
        type: text
      - name: body
        label: Full Content
        type: rich-text

  - name: recommendations
    label: Recommendations
    type: collection
    path: src/content/recommendations
    fields:
      - name: title
        label: Title
        type: string
      - name: number
        label: Recommendation Number
        type: number
      - name: recommendation
        label: Recommendation Text
        type: text
      - name: whyItMatters
        label: Why It Matters
        type: text
      - name: whatCanBeDone
        label: What Can Be Done (Actions)
        type: string
        list: true
      - name: whoShouldAct
        label: Who Should Act
        type: string
        list: true
      - name: relatedFindings
        label: Related Findings (IDs)
        type: string
        list: true
      - name: body
        label: Full Content
        type: rich-text

  - name: audiences
    label: Audience Routes
    type: collection
    path: src/content/audiences
    fields:
      - name: role
        label: Role Name
        type: string
      - name: order
        label: Order Number
        type: number
      - name: intro
        label: Introduction
        type: text
      - name: actions
        label: Actions to take
        type: string
        list: true
      - name: relatedRecommendations
        label: Related Recommendations (IDs)
        type: string
        list: true
      - name: body
        label: Full Content
        type: rich-text

  - name: resources
    label: Resources
    type: collection
    path: src/content/resources
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: date
        label: Date
        type: date
      - name: category
        label: Category
        type: select
        options:
          values:
            - recommendations
            - findings
            - publications
            - briefings
            - presentations
            - media
      - name: link
        label: External Link (URL)
        type: string
      - name: body
        label: Content
        type: rich-text

  - name: impact
    label: Impact Stories
    type: collection
    path: src/content/impact
    fields:
      - name: title
        label: Title
        type: string
      - name: organisation
        label: Organisation
        type: string
      - name: date
        label: Date
        type: date
      - name: description
        label: Short Description
        type: text
      - name: relatedRecommendation
        label: Related Recommendation (ID)
        type: string
      - name: body
        label: Full Story
        type: rich-text

  - name: events
    label: Events
    type: collection
    path: src/content/events
    fields:
      - name: title
        label: Title
        type: string
      - name: startDate
        label: Start Date
        type: date
      - name: location
        label: Location
        type: string
      - name: description
        label: Description
        type: text
      - name: upcoming
        label: Is this an upcoming event?
        type: boolean

  - name: updates
    label: News Updates
    type: collection
    path: src/content/updates
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: summary
        label: Summary
        type: text